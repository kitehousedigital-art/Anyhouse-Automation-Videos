<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyHouse Video Studio</title>
<style>
  :root{--bg:#0d0f13;--panel:#14171d;--panel2:#1b1f27;--panel3:#232834;--line:#2a303c;--text:#eceef3;--mute:#8d96a8;--acc:#ffd21f;--acc-ink:#1a1500;--ok:#3ddc97;--err:#ff6b6b;--r:12px}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  button:hover{border-color:#4a5470;background:var(--panel3)}
  button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
  button.primary:hover{filter:brightness(1.08);background:var(--acc)}
  button.ghost{background:transparent;border-color:transparent;color:var(--mute);padding:5px 7px}
  button.ghost:hover{color:var(--text);background:var(--panel3)}
  button.danger:hover{color:var(--err);border-color:var(--err)}
  button:disabled{opacity:.4;cursor:not-allowed}
  input,textarea,select{width:100%;font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--acc)}
  input[type=color]{padding:2px;height:36px;cursor:pointer}
  input[type=checkbox]{width:auto;accent-color:var(--acc)}
  input[type=range]{padding:0;accent-color:var(--acc);height:20px}
  textarea{resize:vertical;min-height:72px}
  label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
  .row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
  /* top bar */
  .chip{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
  .chip .d{width:8px;height:8px;border-radius:50%;background:var(--mute)}.chip .d.ok{background:var(--ok)}.chip .d.busy{background:var(--acc)}
  /* layout */
  .col{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg)}
  .scroll{flex:1;overflow:auto;padding:14px}
  .tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mute);padding:8px 8px;font-weight:600}
  .tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
  .tabs button:hover{background:transparent;color:var(--text)}
  .tabs .cnt{font-size:11px;background:var(--panel3);border-radius:99px;padding:0 7px;color:var(--mute)}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mute);margin:18px 0 8px;font-weight:700}
  h2:first-child{margin-top:0}
  .hint{color:var(--mute);font-size:12px}
  .empty{color:var(--mute);text-align:center;padding:26px 10px;font-size:13px;border:1px dashed var(--line);border-radius:var(--r)}
  /* video list */
  .vid{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;position:relative}
  .vid:hover{background:var(--panel)}
  .vid.sel{background:var(--panel2);border-color:var(--line)}
  .vid .n{flex:1;min-width:0}
  .vid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
  .vid .s{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vid .acts{display:none;gap:0}
  .vid:hover .acts,.vid.sel .acts{display:flex}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
  .dot.done{background:var(--ok)}.dot.run{background:var(--acc);animation:p 1s infinite}.dot.err{background:var(--err)}
  @keyframes p{50%{opacity:.3}}
  .miniprog{height:3px;background:var(--panel3);border-radius:3px;margin-top:4px;overflow:hidden}.miniprog i{display:block;height:100%;background:var(--acc)}
  /* backgrounds */
  .bgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .bg{position:relative;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#000}
  .bg.used{border-color:var(--acc)}
  .bg img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
  .bg .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:11px;background:linear-gradient(transparent,#000c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bg .ov{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px;opacity:0;transition:.12s}
  .bg:hover .ov{opacity:1}
  .bg .ov button{padding:5px;background:#000b;border-color:#fff2}
  .drop{margin-top:12px;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--mute);font-size:12px;cursor:pointer}
  .drop.over,.drop:hover{border-color:var(--acc);color:var(--text)}
  .rend{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
  .rend .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rend .s{font-size:11px;color:var(--mute);font-weight:400}
  /* stage */
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{background:transparent;border:0;padding:6px 14px;color:var(--mute);font-weight:600}
  .seg button.on{background:var(--text);color:#111}
  .seg button:disabled{opacity:.35}
  .phone img,.phone video{width:100%;height:100%;object-fit:cover;display:block}
  /* right */
  .tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tile{cursor:pointer;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--panel2)}
  .tile:hover{border-color:#4a5470}
  .tile img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
  .tile .nm{font-size:10.5px;padding:4px 6px;color:var(--mute);line-height:1.25;min-height:30px}
  .tile.sel{border-color:var(--acc)}.tile.sel .nm{color:var(--text)}
  details{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--panel2)}
  summary{padding:10px 12px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  details .in{padding:0 12px 12px}
  .rng{display:flex;align-items:center;gap:8px}.rng output{min-width:42px;text-align:right;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--text);font-size:13px}.chk input{margin:0}
  #toast.show{opacity:1}
  .warn{background:#3a2b12;border:1px solid #6b4d16;color:#ffd592;padding:10px 14px;margin:12px 14px 0;border-radius:10px;font-size:13px;display:none;gap:10px;align-items:center}
  .modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:60}
  .modal.show{display:grid}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(400px,92vw)}
  .modal h3{margin:0 0 8px}.modal p{margin:0 0 16px;color:var(--mute)}.modal .btns{display:flex;gap:8px;justify-content:flex-end}
  .ovl{position:absolute;inset:0;touch-action:none}
  .eb{position:absolute;border:1.5px solid transparent;border-radius:5px;cursor:move;touch-action:none}
  .eb:hover{border:1.5px dashed #ffd21fcc}
  .eb.sel{border:2px solid var(--acc);background:#ffd21f18}
  .eb .hd{position:absolute;right:3px;bottom:3px;width:15px;height:15px;background:var(--acc);border:2px solid #000;border-radius:50%;cursor:nwse-resize;display:none}
  .eb.sel .hd{display:block}
  .eb .tag{position:absolute;left:-2px;top:-19px;font-size:10px;font-weight:700;background:var(--acc);color:#111;padding:1px 6px;border-radius:4px;display:none;white-space:nowrap}
  .eb.sel .tag{display:block}
  .seg.small button{padding:4px 10px;font-size:12px}
  .numbox{width:70px!important;flex:none;padding:5px 6px!important;text-align:right}
  .lrow{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:4px;border-radius:10px;border:1.5px solid transparent}
  .lrow.sel{border-color:var(--acc);background:#ffd21f10}
  .lrow .ln{width:18px;text-align:center;color:var(--mute);font-size:11px;flex:none}
  .lrow .ltxt{flex:1;min-width:0}
  .lrow .lcol{width:38px;flex:none;height:34px}
  .lrow .lsz{width:62px;flex:none;padding:6px 6px;text-align:right}
  .lhead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
  .lhead h2{margin:0}

  /* ===== v3 editor layout ===== */
  header{display:flex;align-items:center;gap:8px;padding:0 14px;height:54px;border-bottom:1px solid var(--line);background:var(--panel);flex:none;position:relative;z-index:45}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;margin-right:6px}
  .logo b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--acc);color:var(--acc-ink);font-size:14px}
  header .sp{flex:1}
  header select{width:auto;padding:6px 8px;font-size:13px}
  .menu{display:flex;gap:2px}
  .menu button{background:transparent;border:0;color:var(--mute);font-weight:600;padding:7px 11px;border-radius:8px}
  .menu button:hover,.menu button.on{background:var(--panel3);color:var(--text)}
  .cnt{font-size:11px;background:var(--panel3);border-radius:99px;padding:0 7px;color:var(--mute)}
  .menu button.on .cnt{background:var(--bg)}
  .vsw{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:2px;margin-left:6px;min-width:0}
  .vsw span{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;font-weight:600;font-size:13px}
  .vsw small{color:var(--mute);font-weight:400;margin-left:6px;font-size:11px}
  .st{font-size:12px;color:var(--mute);white-space:nowrap}.st.dirty{color:var(--acc)}
  .pop{position:fixed;top:60px;left:12px;z-index:40;display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px #000b;max-height:calc(100vh - 76px);width:390px}
  .pop.show{display:flex}.pop.wide{width:640px}.pop.wide .bgs{grid-template-columns:repeat(4,1fr)}
  .pop .scroll{padding:12px}
  .tb{display:flex;align-items:flex-end;gap:10px;padding:8px 14px;height:66px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;overflow-x:auto;overflow-y:hidden}
  .tb .nm{align-self:center;font-weight:700;font-size:12px;background:var(--acc);color:var(--acc-ink);padding:4px 10px;border-radius:6px;white-space:nowrap}
  .tb .f{display:flex;flex-direction:column;gap:2px}
  .tb .f label{margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .tb input,.tb select{padding:4px 6px;font-size:12.5px;height:32px}
  .tb input[type=color]{width:40px;padding:2px}.tb input[type=number]{width:64px}.tb select{width:auto}
  .tb .vr{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
  .tb .hintline{align-self:center;color:var(--mute);font-size:13px}
  .tb .end{margin-left:auto;display:flex;gap:6px;align-self:center}
  .tb button{height:32px;padding:0 10px;font-size:12.5px}
  main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
  .col{min-height:0;display:flex;flex-direction:column;background:var(--bg)}
  .side{background:var(--panel);border-left:1px solid var(--line)}
  .stage{display:flex;flex-direction:column;min-height:0;min-width:0;background:radial-gradient(#252c39 1px,transparent 1.3px) 0 0/22px 22px,var(--bg)}
  .sbar{display:flex;align-items:center;gap:12px;padding:10px 16px 0;flex:none}
  .info{flex:1;display:flex;gap:12px;font-size:12px;color:var(--mute);min-width:0;overflow:hidden;white-space:nowrap}.info b{color:var(--text);font-weight:600}
  .sbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px 16px}
  .phone{height:100%;max-height:100%;aspect-ratio:9/16;background:#000;border-radius:26px;border:5px solid #2b303c;overflow:hidden;box-shadow:0 20px 60px #000a;position:relative}
  .phone img,.phone video{width:100%;height:100%;object-fit:cover;display:block}
  .scrub{flex:none;align-self:center;width:min(620px,calc(100% - 32px));display:flex;align-items:center;gap:10px;padding:2px 0 12px}
  .scrub input{padding:0;accent-color:var(--acc)}
  .scrub span{font-variant-numeric:tabular-nums;color:var(--mute);min-width:96px;text-align:right;font-size:12px}
  .bigprog{flex:none;height:4px;background:var(--panel3);overflow:hidden}.bigprog i{display:block;height:100%;background:var(--acc);transition:width .4s}
  .tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
  .tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--mute);padding:13px 8px;font-weight:600}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--text);color:#111;padding:8px 18px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;box-shadow:0 8px 24px #0007}
  #toast.show{opacity:1}
  @media(max-width:1350px){.hl{display:none}.vsw span{max-width:150px}}
  @media(max-width:950px){main{grid-template-columns:1fr}.side{min-height:70vh;border-left:0}}
  /* ===== v4 additions ===== */
  .tb .f select[data-k=font]{width:158px}
  .tb .f select#i_preset{width:150px}
  .f.unset input[type=color],.cw.unset input[type=color]{opacity:.45}
  .cw{display:flex;gap:4px;align-items:center}.cw input[type=color]{flex:1}
  .cw .clr{padding:0 8px;height:34px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 10px}
  .g2 label,.g3 label{margin:8px 0 3px;font-size:11.5px}
  .span2{grid-column:span 2}
  .pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .pills button{padding:4px 10px;font-size:12px}.pills button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .pchip{flex-direction:column;gap:2px;padding:8px 4px;background:#2a2f3a;border-radius:10px;min-height:62px;justify-content:center}
  .pchip b{font-size:21px;line-height:1.1;font-weight:400;padding:0 8px;border-radius:6px}
  .pchip small{font-size:10px;color:var(--mute)}
  .guide{position:absolute;background:#ff3df0;pointer-events:none;z-index:3}
  .guide.v{left:50%;top:0;bottom:0;width:1px}.guide.h{top:50%;left:0;right:0;height:1px}
  .safe{position:absolute;inset:0;pointer-events:none;display:none;z-index:2}
  .safe.show{display:block}
  .safe i{position:absolute;background:rgba(255,70,70,.16);border:1px dashed rgba(255,110,110,.7)}
  .safe .t{left:0;right:0;top:0;height:13%}.safe .b{left:0;right:0;bottom:0;height:20%}.safe .r{right:0;width:11%;top:13%;bottom:20%}
  .safe em{position:absolute;left:6px;top:4px;font:600 9px system-ui;color:#ffb0b0;font-style:normal}
  .seg.small.wrap{flex-wrap:wrap}
  .sheetp label{margin:10px 0 4px}
  .sheetp table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  .sheetp td,.sheetp th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheetp th{color:var(--mute);font-weight:600}
  .maps{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}.maprow{display:flex;flex-direction:column;gap:3px;margin:6px 0}.maprow span{font-size:11.5px;color:var(--mute)}
  .stick{position:sticky;bottom:-12px;background:var(--panel);padding:10px 0 4px;border-top:1px solid var(--line);margin-top:12px;z-index:2}
  header .chip,header .st,header label,.logo{white-space:nowrap}
  @media(max-width:1600px){.logo span{display:none}}
  .maprow select{padding:6px 8px}
  .ok{color:var(--ok)}.bad{color:var(--err)}
</style>
</head>
<body>
<header>
  <div class="logo"><b>A</b><span class="hl">AnyHouse Studio</span></div>
  <nav class="menu" id="menu">
    <button data-t="videos">Videos <span class="cnt" id="c-videos">0</span></button>
    <button data-t="bgs">Clips <span class="cnt" id="c-bgs">0</span></button>
    <button data-t="renders">Renders <span class="cnt" id="c-renders">0</span></button>
    <button data-t="sheet">Sheet</button>
  </nav>
  <button id="addBtn" class="ghost" title="New video"><svg class="i"><use href="#i-plus"/></svg><span class="hl">New</span></button>
  <button id="undoBtn" class="ghost" title="Undo (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button><button id="redoBtn" class="ghost" title="Redo (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg></button>
  <div class="vsw"><button class="ghost" id="prevV" title="Previous video"><svg class="i"><use href="#i-left"/></svg></button><span id="curName">-</span><small id="curNo"></small><button class="ghost" id="nextV" title="Next video"><svg class="i"><use href="#i-right"/></svg></button></div>
  <span class="sp"></span>
  <span class="chip" id="ffchip" style="white-space:nowrap"><span class="d"></span><span>checking...</span></span>
  <span class="st" id="st"></span>
  <label class="chip" style="margin:0"><input type="checkbox" id="autosave"> Auto-save</label>
  <select id="quality" title="Render quality"><option value="draft">Draft 720p</option><option value="standard">Standard 1080p</option><option value="high">High quality</option></select>
  <label class="chip" id="gpuwrap" style="margin:0;display:none"><input type="checkbox" id="gpu"> GPU</label>
  <button id="saveBtn" title="Ctrl+S">Save</button>
  <button id="allBtn" title="Render every video"><svg class="i"><use href="#i-play"/></svg><span class="hl">Render all</span></button>
  <button id="renderBtn" class="primary"><svg class="i"><use href="#i-play"/></svg>Render <span class="hl">this video</span></button>
</header>
<div class="pop" id="pop"><div class="scroll" id="lpane"></div></div>
<input id="file" type="file" accept="video/*" multiple hidden>
<input id="fontfile" type="file" accept=".ttf,.otf" hidden>
<div class="tb" id="insp"></div>
<div class="warn" id="warn"><span id="warntxt" style="flex:1"></span><button id="fixff">Install FFmpeg helper</button></div>

<main>
  <section class="stage">
    <div class="sbar">
      <div class="seg"><button id="vLive" class="on">Live preview</button><button id="vOut" disabled>Rendered</button><button id="vClip" disabled>Clip</button></div>
      <div class="info" id="info"></div>
      <div class="dragbar" id="dragbar"><button class="small ghost" id="safeBtn" title="Show Instagram Reels UI-covered areas (approx.)">Safe zones</button><div class="seg small" id="dmode"><button data-m="video" class="on" title="Changes apply to this video only">This video</button><button data-m="layout" title="Changes apply to every video using this layout">Whole layout</button></div></div>
    </div>
    <div class="sbody"><div class="phone"><img id="img" alt=""><div class="ovl" id="ovl"></div><div id="guides"></div><div class="safe" id="safe"><i class="t"></i><i class="b"></i><i class="r"></i><em>Reels UI zones (approx.)</em></div><video id="vid" controls loop style="display:none"></video></div></div>
    <div class="scrub" id="scrubRow"><button id="play" class="ghost"><svg class="i"><use href="#i-play"/></svg></button><input id="scrub" type="range" min="0" max="10" step="0.1" value="0"><span id="tlabel">0.0s</span></div>
    <div class="bigprog" id="bigprog" style="display:none"><i></i></div>
  </section>
  <aside class="col side">
    <div class="tabs" id="rtabs"><button data-t="content" class="on">Content</button><button data-t="design">Design</button><button data-t="layout">Layout</button><button data-t="tpl">Edit layout</button></div>
    <div class="scroll" id="rpane"></div>
  </aside>
</main>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box"><h3 id="mt"></h3><p id="mp"></p><div class="btns"><button id="mno">Cancel</button><button id="myes" class="primary">OK</button></div></div></div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3"/></symbol>

</defs></svg>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={templates:[],videos:[],bgs:[],fonts:[],outputs:{},jobs:{},settings:{},ffmpeg:true,gpu:null};
let sel=0, lt='videos', rt='content', view='live', tOverride=null, total=10, seq=0, ptimer=null, playing=null, saveT=null;
let dirtyC=false, dirtyT=false, tplVer=Date.now(), clipName=null;
let selEl=null, els=[], dmode='video', dragging=false, bulk=false;

const DEF={font:'Poppins-Bold.ttf',max_size:90,min_size:28,color:'#FFFFFF',stroke:0,stroke_color:'#000000',align:'center',upper:false,line_spacing:1.15,gap:16,x_margin:.08,y:.3,box_h:.4,valign:'top'};
const DEF_BG={mode:'line',color:'#000000',opacity:1,radius:28,pad_x:28,pad_y:8,full:false};
const TD={interval:2,intro:.4,fade:.3,header_delay:.9,end_hold:2.2,min_hold:3,min_duration:6,darken:.2};

/* ---------- helpers ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2300)}
async function api(p,o){const r=await fetch(p,o);if(!r.ok){let e='';try{e=(await r.json()).error}catch{}throw new Error(e||r.statusText)}return r}
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
function ask(title,msg,ok='Delete'){return new Promise(res=>{$('#mt').textContent=title;$('#mp').textContent=msg;$('#myes').textContent=ok;$('#modal').classList.add('show');
  const done=v=>{$('#modal').classList.remove('show');res(v)};$('#myes').onclick=()=>done(true);$('#mno').onclick=()=>done(false)})}
const cur=()=>S.videos[sel];
const tplOf=v=>S.templates.find(t=>t.id===(v||cur())?.template)||S.templates[0];
const curTpl=()=>tplOf(cur());
const uniq=(base,list)=>{base=base.replace(/[^A-Za-z0-9_-]/g,'_');let n=base,i=2;while(list.includes(n))n=base+'_'+i++;return n};
const fmtSize=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB';
const lines2text=a=>(a||[]).map(l=>l.replace(/\n/g,' | ')).join('\n');
const text2lines=t=>t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>l.replace(/\s*\|\s*/g,'\n'));
function bgFor(v,idx){
  const names=S.bgs.map(b=>b.name); if(!names.length)return '';
  const want=(v.background||'').toLowerCase(); if(want){const m=names.find(n=>n.toLowerCase().includes(want));if(m)return m}
  for(const t of v.tags||[]){const m=names.find(n=>n.toLowerCase().includes(String(t).toLowerCase()));if(m)return m}
  return names[idx%names.length];
}
function setStatus(){
  const e=$('#st'); if(dirtyC||dirtyT){e.textContent='Unsaved changes';e.className='st dirty'}else{e.textContent='All changes saved';e.className='st'}
}
function dirty(c,t){if(c)dirtyC=true;if(t)dirtyT=true;setStatus();histSoon();if(S.settings.autosave){clearTimeout(saveT);saveT=setTimeout(saveAll,1200)}}
async function saveAll(silent){
  try{
    if(dirtyC){await post('/api/content',{videos:S.videos});dirtyC=false}
    if(dirtyT){await post('/api/templates',{templates:S.templates});dirtyT=false;tplVer=Date.now();if(rt==='layout')renderRight()}
    try{S.mtimes=await (await api('/api/mtimes')).json()}catch{}
    setStatus(); if(silent!==true)toast('Saved')
  }catch(e){toast('Save failed: '+e.message)}
}

/* ---------- per-element data helpers ---------- */
const lineObj=l=>typeof l==='string'?{text:l}:{...l};
const lineText=l=>typeof l==='string'?l:(l.text||'');
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
function cleanPatch(o,patch){for(const k in patch){const v=patch[k];if(v===''||v==null||(typeof v==='number'&&Number.isNaN(v)))delete o[k];else o[k]=v}return o}
function getEl(sel){const v=cur();if(!v||!sel)return {};return sel.kind==='header'?(v.header_style||{}):lineObj(v.lines[sel.i]??'')}
function setEl(sel,patch){
  const v=cur();if(!v||!sel)return;
  if(sel.kind==='header'){const o=cleanPatch({...(v.header_style||{})},patch);Object.keys(o).length?v.header_style=o:delete v.header_style}
  else{const o=cleanPatch(lineObj(v.lines[sel.i]),patch);v.lines[sel.i]=(Object.keys(o).length===1&&'text' in o)?o.text:o}
}
const baseStyle=sel=>{const t=curTpl()||{};return (sel.kind==='header'?t.header:t.body)||{}};
const elLabel=sel=>sel.kind==='header'?'Headline':'Line '+(sel.i+1);
const findEl=sel=>els.find(e=>e.k===sel.kind&&e.i===sel.i);
const curT=()=>+$('#scrub').value;

/* ---------- load ---------- */
async function load(){
  S=await (await api('/api/state')).json();
  if(sel>=S.videos.length)sel=Math.max(0,S.videos.length-1);
  $('#quality').value=S.settings.quality;$('#gpu').checked=!!S.settings.gpu;$('#autosave').checked=!!S.settings.autosave;
  $('#gpuwrap').style.display=S.gpu?'flex':'none';
  S.presets=S.presets||{fonts:[],styles:[]};injectFonts();ffStatus();renderLeft();renderRight();renderViewTabs();renderInsp();preview();setStatus();lastSnap=snap();undoS=[];redoS=[];histBtns();
}
async function refreshLists(){
  const st=await (await api('/api/state')).json();
  S.bgs=st.bgs;S.outputs=st.outputs;S.jobs=st.jobs;S.fonts=st.fonts;S.presets=st.presets||S.presets;S.ffmpeg=st.ffmpeg;S.gpu=st.gpu;
  ffStatus();renderLeft();renderViewTabs();
}
function ffStatus(){
  const ch=$('#ffchip');
  ch.innerHTML=S.ffmpeg?'<span class="d ok"></span><span>FFmpeg ready</span>':'<span class="d"></span><span>FFmpeg missing</span>';
  $('#warn').style.display=S.ffmpeg?'none':'flex';
  $('#warntxt').textContent='FFmpeg was not found, so backgrounds cannot be read or videos rendered. Click the button to install the bundled helper (needs internet, no admin rights).';
}
$('#fixff').onclick=async()=>{$('#fixff').disabled=true;$('#fixff').textContent='Installing...';
  try{const r=await (await post('/api/setup_ffmpeg',{})).json();toast(r.ok?'FFmpeg installed':'Install failed - run: pip install imageio-ffmpeg')}catch(e){toast(e.message)}
  $('#fixff').disabled=false;$('#fixff').textContent='Install FFmpeg helper';await load()};

/* ---------- left ---------- */
let popOpen=false;
function openPop(t,btn){lt=t;popOpen=true;const pop=$('#pop');pop.classList.toggle('wide',t==='bgs'||t==='sheet');pop.classList.add('show');
  const r=btn.getBoundingClientRect(),w=(t==='bgs'||t==='sheet')?640:390;pop.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';renderLeft()}
function closePop(){popOpen=false;$('#pop').classList.remove('show');$$('#menu button').forEach(b=>b.classList.remove('on'))}
$$('#menu button').forEach(b=>b.onclick=e=>{e.stopPropagation();if(popOpen&&lt===b.dataset.t)closePop();else openPop(b.dataset.t,b)});
document.addEventListener('mousedown',e=>{if(popOpen&&!e.target.closest('#pop,#menu,#modal'))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&popOpen)closePop()});
function pickVideo(i){if(i<0||i>=S.videos.length)return;sel=i;selEl=null;tOverride=null;renderLeft();renderRight();renderViewTabs();preview()}
$('#prevV').onclick=()=>pickVideo(sel-1);$('#nextV').onclick=()=>pickVideo(sel+1);
function vstatus(v){const j=S.jobs[v.id];
  if(j&&j.status==='running')return['run',Math.round((j.progress||0)*100)+'% rendering'];
  if(j&&j.status==='error')return['err','error: '+j.msg.split('\n').pop()];
  if(S.outputs[v.id])return['done','rendered'];return['','not rendered']}
function renderLeft(){
  $$('#menu button').forEach(b=>b.classList.toggle('on',popOpen&&b.dataset.t===lt));
  {const v=S.videos[sel];$('#curName').textContent=v?(v.header||v.id).replace(/\n/g,' '):'No video';$('#curNo').textContent=v?(sel+1)+'/'+S.videos.length:''}
  $('#c-videos').textContent=S.videos.length;$('#c-bgs').textContent=S.bgs.length;$('#c-renders').textContent=Object.keys(S.outputs).length;
  const p=$('#lpane');
  if(lt==='videos'){
    if(!S.videos.length){p.innerHTML='<div class="empty">No videos yet.<br>Click “New video” to start.</div>';return}
    p.innerHTML='';
    S.videos.forEach((v,i)=>{
      const [c,txt]=vstatus(v),j=S.jobs[v.id],d=document.createElement('div');
      d.className='vid'+(i===sel?' sel':'');
      d.innerHTML=`<span class="dot ${c}"></span><div class="n"><div class="t">${esc((v.header||v.id).replace(/\n/g,' '))}</div><div class="s">${esc(txt)}${v.status==='verify'?' · verify figures':''}</div>${j&&j.status==='running'?`<div class="miniprog"><i style="width:${(j.progress||0)*100}%"></i></div>`:''}</div>
      <div class="acts"><button class="ghost" data-a="up" title="Move up">${ic('up')}</button><button class="ghost" data-a="down" title="Move down">${ic('down')}</button><button class="ghost" data-a="dup" title="Duplicate">${ic('copy')}</button><button class="ghost danger" data-a="del" title="Delete">${ic('trash')}</button></div>`;
      d.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a){e.stopPropagation();return vAct(a,i)}closePop();pickVideo(i)};
      p.appendChild(d);
    });
  }else if(lt==='sheet'){renderSheet(p)
  }else if(lt==='bgs'){
    const used=S.videos[sel]?bgFor(S.videos[sel],sel):'';
    p.innerHTML=`<div class="hint" style="margin-bottom:10px">Drop clips here. Hover a clip to use it for the selected video, play it, or delete it. Put a city in the file name (e.g. <b>utrecht_canal.mp4</b>) to auto-match tagged videos.</div>
    <div class="bgs">${S.bgs.map(b=>`<div class="bg ${b.name===used?'used':''}" data-n="${esc(b.name)}"><img loading="lazy" src="/api/bgthumb?name=${encodeURIComponent(b.name)}"><div class="cap">${esc(b.name)} · ${fmtSize(b.size)}</div>
      <div class="ov"><button data-a="use" title="Use for selected video">${ic('check')}</button><button data-a="play" title="Play clip">${ic('play')}</button><button data-a="del" class="danger" title="Delete clip">${ic('trash')}</button></div></div>`).join('')}</div>
    <div class="drop" id="drop">Drop video files here<br>or click to upload</div>
    <button style="margin-top:10px" id="openin">${ic('folder')}Open inbox folder</button>`;
    p.querySelectorAll('.bg').forEach(el=>el.onclick=e=>{const a=e.target.closest('[data-a]')?.dataset.a;if(a)bgAct(a,el.dataset.n)});
    wireDrop();$('#openin').onclick=()=>post('/api/open_folder',{which:'inbox'}).catch(e=>toast(e.message));
  }else{
    const keys=Object.keys(S.outputs);
    p.innerHTML=(keys.length?keys.map(k=>`<div class="rend"><div class="n">${esc(k)}.mp4<div class="s">${fmtSize(S.outputs[k].size)}</div></div>
      <button class="ghost" data-a="play" data-n="${esc(k)}" title="Play">${ic('play')}</button><a href="/files/output/${encodeURIComponent(k)}.mp4?dl=1"><button class="ghost" title="Download">${ic('dl')}</button></a>
      <button class="ghost danger" data-a="del" data-n="${esc(k)}" title="Delete render">${ic('trash')}</button></div>`).join(''):'<div class="empty">No rendered videos yet.</div>')+
      `<button style="margin-top:6px" id="openout">${ic('folder')}Open output folder</button>`;
    p.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{const n=b.dataset.n;
      if(b.dataset.a==='play'){const i=S.videos.findIndex(v=>v.id===n);closePop();if(i>=0){sel=i;renderLeft();renderRight();}view='out';outFor=n;renderViewTabs();$('#vid').play()}
      else if(await ask('Delete render?',n+'.mp4 will be removed from the output folder.')){await post('/api/delete',{kind:'output',name:n});await refreshLists()}});
    $('#openout').onclick=()=>post('/api/open_folder',{which:'output'}).catch(e=>toast(e.message));
  }
}
async function vAct(a,i){
  const v=S.videos[i];
  if(a==='del'){if(!await ask('Delete this video?',`"${(v.header||v.id).replace(/\n/g,' ')}" will be removed from your list. Rendered files are kept (delete them in the Renders tab).`))return;
    S.videos.splice(i,1);sel=Math.max(0,Math.min(sel,S.videos.length-1))}
  if(a==='dup'){const c=JSON.parse(JSON.stringify(v));c.id=uniq(v.id+'_copy',S.videos.map(x=>x.id));S.videos.splice(i+1,0,c);sel=i+1}
  if(a==='up'&&i>0){[S.videos[i-1],S.videos[i]]=[S.videos[i],S.videos[i-1]];sel=i-1}
  if(a==='down'&&i<S.videos.length-1){[S.videos[i+1],S.videos[i]]=[S.videos[i],S.videos[i+1]];sel=i+1}
  selEl=null;tOverride=null;dirty(true);renderLeft();renderRight();renderViewTabs();preview();
}
async function bgAct(a,n){
  if(a==='use'){const v=cur();if(!v)return toast('Select a video first');v.background=n;dirty(true);renderLeft();renderRight();preview();closePop();toast('Background set for this video')}
  if(a==='play'){closePop();clipName=n;view='clip';renderViewTabs()}
  if(a==='del'&&await ask('Delete background clip?',n+' will be permanently removed from the inbox.')){
    await post('/api/delete',{kind:'bg',name:n});S.videos.forEach(v=>{if(v.background===n)delete v.background});dirty(true);await refreshLists();preview()}
}
function wireDrop(){
  const drop=$('#drop'),file=$('#file');
  drop.onclick=()=>file.click();file.onchange=()=>up(file.files);
  ['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',ev=>up(ev.dataTransfer.files));
}
async function up(files){
  for(const f of files){const d=$('#drop');if(d)d.textContent='Uploading '+f.name+'...';
    try{await api('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f})}catch(e){toast(f.name+': '+e.message)}}
  await refreshLists();preview();
}

/* ---------- right ---------- */
$$('#rtabs button').forEach(b=>b.onclick=()=>{rt=b.dataset.t;renderRight()});
function renderRight(){
  $$('#rtabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===rt));
  const v=cur(),p=$('#rpane');
  if(!v){p.innerHTML='<div class="empty">Select or create a video.</div>';return}
  if(rt==='content')return renderContent(v,p);
  if(rt==='design')return renderDesign(p);
  if(rt==='layout')return renderLayout(v,p);
  renderTplEditor(p);
}
function lineRowsHTML(v){
  const base=(curTpl()||{}).body||{},dc=(base.color||DEF.color).slice(0,7);
  return v.lines.map((l,i)=>{const o=lineObj(l);
    return `<div class="lrow ${selEl&&selEl.kind==='line'&&selEl.i===i?'sel':''}" data-i="${i}"><span class="ln">${i+1}</span>
    <input class="ltxt" value="${esc(lineText(l).replace(/\n/g,' | '))}" placeholder="Line text">
    <input class="lcol" type="color" title="Text color" value="${(o.color||dc).slice(0,7)}">
    <input class="lsz" type="number" min="10" max="400" title="Font size (empty = auto)" placeholder="auto" value="${o.size??''}">
    <button class="ghost" data-a="up" title="Move up">${ic('up')}</button><button class="ghost" data-a="down" title="Move down">${ic('down')}</button><button class="ghost danger" data-a="del" title="Delete line">${ic('trash')}</button></div>`}).join('')||'<div class="empty">No lines yet.</div>';
}
function renderContent(v,p){
  const hb=(curTpl()||{}).header||{},hc=(hb.color||DEF.color).slice(0,7),hs=v.header_style||{};
  p.innerHTML=`
    <h2>Headline</h2>
    <textarea id="f_header" rows="2"></textarea>
    <div class="lrow ${selEl&&selEl.kind==='header'?'sel':''}" id="hrow" style="margin-top:8px"><span class="ln" style="width:auto">Aa</span>
      <span class="hint" style="flex:1">Color &amp; size for the headline</span>
      <input class="lcol" id="h_col" type="color" value="${(hs.color||hc).slice(0,7)}" title="Headline color"><input class="lsz" id="h_sz" type="number" min="10" max="400" placeholder="auto" value="${hs.size??''}" title="Headline size (empty = auto)"></div>
    <div class="lhead"><h2>Lines</h2><button class="small ghost" id="bulkBtn">${bulk?'Back to rows':'Bulk edit'}</button></div>
    ${bulk?`<textarea id="f_bulk" rows="9" placeholder="One line per row (use ' | ' for a line break inside a row)"></textarea>`:`<div id="lines">${lineRowsHTML(v)}</div><button id="addLine" style="margin-top:4px">${ic('plus')}Add line</button>
    <div class="hint" style="margin-top:8px">Click a row to select it on the preview. Color and size here apply to that line only; leave size empty for automatic fitting.</div>`}
    <div class="row" style="margin-top:6px"><div><label>Seconds per line</label><input id="f_interval" type="number" step="0.1" min="0.3" placeholder="layout default"></div>
    <div><label>Hold at end (s)</label><input id="f_hold" type="number" step="0.1" min="0" placeholder="default"></div></div>
    <h2>Background &amp; extras</h2>
    <label>Background clip</label><select id="f_bg"><option value="">Auto (match tag in filename, else rotate)</option>${S.bgs.map(b=>`<option>${esc(b.name)}</option>`).join('')}</select>
    <label>Tags (comma separated, matched against clip filenames)</label><input id="f_tags" placeholder="utrecht, amsterdam">
    <label>End call-to-action (optional)</label><input id="f_cta" placeholder="e.g. anyhouse.me">
    <h2>Details</h2>
    <div class="row"><div><label>Name / file id</label><input id="f_id"></div>
    <div><label>Figures</label><select id="f_status"><option value="">OK</option><option value="verify">Needs verification</option></select></div></div>
    <label>Caption + hashtags (for posting)</label><textarea id="f_cap" rows="3" placeholder="Caption on the first line, hashtags after"></textarea>`;
  const set=(id,val)=>{const e=$(id);if(e)e.value=val==null?'':val};
  set('#f_header',v.header);set('#f_interval',v.interval);set('#f_hold',v.hold);set('#f_bg',v.background);
  set('#f_tags',(v.tags||[]).join(', '));set('#f_cta',v.cta);set('#f_id',v.id);set('#f_status',v.status==='verify'?'verify':'');set('#f_cap',[v.caption,v.hashtags].filter(Boolean).join('\n'));
  const bind=(id,fn,pv=true)=>{const e=$(id);if(e)e.addEventListener('input',()=>{fn(e.value);dirty(true);renderLeftSoft();if(pv)preview(250)})};
  bind('#f_header',x=>v.header=x);
  bind('#f_interval',x=>x===''?delete v.interval:v.interval=+x);bind('#f_hold',x=>x===''?delete v.hold:v.hold=+x);
  bind('#f_bg',x=>x?v.background=x:delete v.background);bind('#f_cta',x=>x?v.cta=x:delete v.cta);
  bind('#f_tags',x=>{const t=x.split(',').map(s=>s.trim()).filter(Boolean);t.length?v.tags=t:delete v.tags});
  bind('#f_id',x=>v.id=uniq(x||'video',S.videos.filter(o=>o!==v).map(o=>o.id)),false);bind('#f_status',x=>x?v.status=x:delete v.status,false);
  bind('#f_cap',x=>{const q=x.split('\n');v.caption=q[0]||'';v.hashtags=q.slice(1).join(' ')},false);
  // headline color / size
  const hsel=()=>select('header',0,false);
  $('#hrow').addEventListener('focusin',hsel);$('#hrow').addEventListener('click',hsel);
  $('#h_col').addEventListener('input',e=>{setEl({kind:'header',i:0},{color:e.target.value});dirty(true);fillInsp();preview(80)});
  $('#h_sz').addEventListener('input',e=>{setEl({kind:'header',i:0},{size:e.target.value===''?null:+e.target.value});dirty(true);fillInsp();preview(120)});
  $('#f_header').addEventListener('focus',hsel);
  if(bulk){
    $('#f_bulk').value=lines2text(v.lines.map(lineText));
    $('#f_bulk').addEventListener('input',e=>{const old=v.lines,tx=text2lines(e.target.value);
      v.lines=tx.map((t,i)=>i<old.length?(()=>{const o=lineObj(old[i]);o.text=t;return Object.keys(o).length===1?t:o})():t);dirty(true);renderLeftSoft();preview(250)});
  }else{
    const box=$('#lines');
    box.addEventListener('input',e=>{const row=e.target.closest('.lrow');if(!row)return;const i=+row.dataset.i;
      if(e.target.classList.contains('ltxt'))setEl({kind:'line',i},{text:e.target.value.replace(/\s*\|\s*/g,'\n')});
      else if(e.target.classList.contains('lcol'))setEl({kind:'line',i},{color:e.target.value});
      else if(e.target.classList.contains('lsz'))setEl({kind:'line',i},{size:e.target.value===''?null:+e.target.value});

  if(SM.header<0&&SH.headers.length)SM.header=0;if(SM.lines<0&&!lineCols().length&&SH.headers.length>1)SM.lines=SH.headers.findIndex((h,i)=>i!==SM.header&&i>=0)}

    if(!lines.length&&g('lines'))lines=text2lines(String(r[SM.lines]));

/* ---------- render ---------- */
async function render(ids){
  if(!S.ffmpeg)return toast('FFmpeg is missing - use the install button at the top');
  if(dirtyC||dirtyT)await saveAll(true);
  await post('/api/render',{ids,quality:$('#quality').value,gpu:$('#gpu').checked});
  toast('Rendering '+ids.length+' video'+(ids.length>1?'s':'')+'...');poll();
}
let pollT=null;
function poll(){clearTimeout(pollT);pollT=setTimeout(async()=>{
  try{
    const jobs=await (await api('/api/jobs')).json(),was=S.jobs;S.jobs=jobs;
    const running=Object.values(jobs).some(j=>j.status==='running');
    renderLeftSoft();renderViewTabs();
    if(running)poll();else{await refreshLists();Object.entries(jobs).forEach(([k,j])=>{if(was[k]&&was[k].status==='running'&&j.status==='error')toast('Render failed: '+j.msg.split('\n').pop())});
      if(Object.values(was).some(j=>j.status==='running')){toast('Render finished');if(cur()&&S.outputs[cur().id]){view='out';outFor=cur().id;renderViewTabs()}}}
  }catch(e){poll()}
},900)}
$('#saveBtn').onclick=()=>saveAll();
$('#renderBtn').onclick=()=>cur()&&render([cur().id]);
$('#allBtn').onclick=()=>S.videos.length&&render(S.videos.map(v=>v.id));
$('#addBtn').onclick=()=>{
  const id=uniq('new_video',S.videos.map(v=>v.id));
  S.videos.push({id,template:(curTpl()||S.templates[0]).id,header:'New headline',lines:['First line','Second line','Third line']});
  sel=S.videos.length-1;tOverride=null;selEl=null;rt='content';closePop();dirty(true);renderLeft();renderRight();renderViewTabs();preview();
};
async function saveSettings(){S.settings={...S.settings,quality:$('#quality').value,gpu:$('#gpu').checked,autosave:$('#autosave').checked};await post('/api/settings',S.settings)}
['#quality','#gpu','#autosave'].forEach(s=>$(s).addEventListener('change',saveSettings));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveAll()}});
window.addEventListener('beforeunload',e=>{if(dirtyC||dirtyT){e.preventDefault();e.returnValue=''}});
setInterval(async()=>{ /* an agent (MCP) or another editor changed the files on disk -> reload when nothing is unsaved */
  if(dirtyC||dirtyT||dragging||document.hidden||!S.mtimes)return;
  try{const m=await (await api('/api/mtimes')).json();
    if(m.content!==S.mtimes.content||m.templates!==S.mtimes.templates){await load();toast('Updated - files changed on disk')}}catch(e){}
},4000);
load().then(()=>{if(Object.values(S.jobs).some(j=>j.status==='running'))poll()});
</script>
</body>
</html>
